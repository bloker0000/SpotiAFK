[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spotiafk"
dynamic = ["version"]
description = "Plays Spotify on a spare device while you're away, and hands it back when you're not"
readme = "readme.md"
license = { file = "LICENSE" }
authors = [{ name = "Staninna" }]
requires-python = ">=3.11"
dependencies = ["spotipy~=2.26", "requests>=2.25", "urllib3>=1.26"]

[project.urls]
Source = "https://github.com/bloker0000/SpotiAFK"
Original = "https://github.com/Staninna/SpotiAFK"

[project.scripts]
spotiafk = "spotiafk.cli:main"

[tool.setuptools]
packages = ["spotiafk"]

[tool.setuptools.dynamic]
# spotiafk.__init__, not spotiafk: on windows and macos file names ignore case, so setuptools finds spotiAFK.py first
version = { attr = "spotiafk.__init__.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
